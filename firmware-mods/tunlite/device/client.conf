# Management tunnel: Notion 5G -> H3S OpenVPN server (the one the omnicap lab MikroTik uses).
# Server side: ~/openvpn-lab-server on h3s-dev (container onmicap-lab-openvpn), TCP/1194, published
# through the office gateway at 190.145.155.2. Username/password auth (checkpsw.sh), no client cert.
client
dev tun0
proto tcp-client
remote 190.145.155.2 1194
connect-retry 5 60
resolv-retry infinite
nobind
auth-user-pass auth.txt
ca ca.crt
# The server is a lab setup tuned for RouterOS 6: AES-256-CBC / SHA1, self-signed server cert.
cipher AES-256-CBC
data-ciphers AES-256-CBC
auth SHA1
# Never take the default route: this tunnel is only for management, user traffic keeps going out the SIM.
pull-filter ignore redirect-gateway
route-nopull
keepalive 10 60
persist-tun
persist-key
verb 3
