mCaptivePortal = 认证门户
lt_OCGW_title = 认证门户 (omnicap)
lt_OCGW_note = Wi-Fi 和 LAN 客户端在上网前必须在 omnicap 门户注册。设备通过 RADIUS 验证访问并应用套餐的时长和速率。
lt_OCGW_enable = 启用认证门户
lt_OCGW_state = 状态：
lt_OCGW_stOff = 已禁用（开放网络）
lt_OCGW_stDown = 已启用，但服务未运行
lt_OCGW_stOn = 运行中
lt_OCGW_stLogin = 登录地址
lt_OCGW_secPortal = 门户
lt_OCGW_portalUrl = 门户 URL（…/portal/REF）：
lt_OCGW_nas = 设备标识（NAS-Identifier）：
lt_OCGW_secRadius = RADIUS 服务器
lt_OCGW_radiusServer = 服务器：
lt_OCGW_ports = 认证 / 计费端口：
lt_OCGW_secret = 共享密钥：
lt_OCGW_keepBlank = 留空则保留已保存的值。
lt_OCGW_keepBlank2 = 留空则保留已保存的值。
lt_OCGW_saved = 已保存
lt_OCGW_secHttps = 安全登录（HTTPS）
lt_OCGW_https = 通过 HTTPS 接收凭据
lt_OCGW_loginHost = 域名和端口：
lt_OCGW_certSource = 证书：
lt_OCGW_srcAgent = 从 omnicap 下载
lt_OCGW_srcManual = 手动上传
lt_OCGW_agentUrl = omnicap URL：
lt_OCGW_agentToken = 设备令牌：
lt_OCGW_cert = 已安装证书：
lt_OCGW_certNone = 无
lt_OCGW_certIssuer = 签发者
lt_OCGW_certUntil = 有效期至
lt_OCGW_certPem = 证书（PEM，含证书链）：
lt_OCGW_keyPem = 私钥（PEM）：
lt_OCGW_btnUploadCert = 安装证书
lt_OCGW_btnFetch = 立即下载证书
lt_OCGW_secAccess = 访问
lt_OCGW_walled = 无需注册即可访问的网站（逗号分隔）：
lt_OCGW_bypass = 不经过门户的 MAC（逗号分隔）：
lt_OCGW_secClients = 已连接客户端
lt_OCGW_colMac = MAC
lt_OCGW_colIp = IP
lt_OCGW_colUser = 用户
lt_OCGW_colTime = 已用 / 剩余时间
lt_OCGW_colTraffic = 流量
lt_OCGW_colRate = 速率
lt_OCGW_kick = 断开
lt_OCGW_noClients = 没有已连接的客户端。
lt_OCGW_errUrl = 门户 URL 无效。
lt_OCGW_errNas = 标识只能包含字母、数字和 _ . : -（最多 64 个）。
lt_OCGW_errServer = RADIUS 服务器无效。
lt_OCGW_errPort = 端口必须在 1 到 65535 之间。
lt_OCGW_errSecret = 密钥长度须为 8 到 128 个字符，不含引号或空格。
lt_OCGW_errPem = 请粘贴 PEM 格式的证书和私钥。
lt_OCGW_errHost = 请输入安全登录域名（例如 login.h3s-iot.com）。
lt_OCGW_errAgentUrl = omnicap URL 无效（例如 https://cautivo.h3s-iot.com）。
lt_OCGW_errToken = 请输入 omnicap 提供的设备令牌。
lt_OCGW_errWalled = 允许的网站必须是域名、IP 或网段（IP/掩码），以逗号分隔。
lt_OCGW_errBypass = MAC 格式须为 AA:BB:CC:DD:EE:FF，以逗号分隔。
