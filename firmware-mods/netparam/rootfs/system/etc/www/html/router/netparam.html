<html>
	<head>
		<script type="text/javascript">
			function redirect() {
				var nowUrl = window.location.href;
				if (nowUrl.indexOf('/html/') != -1) {
					window.location.href = window.location.protocol + "//" + window.location.host;
				}
			}
			redirect();
		</script>
	</head>
	<body>
		<label id="lt_NetParam_title" class="title"></label>
		<div class="noteBox">
			<p id="lt_NetParam_note" class="note_list"></p>
		</div>
		<div class="wps_group">
			<input type="checkbox" id="NetParamEnable">
			<span id="lt_NetParam_enable"></span>
		</div>
		<div class="wps_group">
			<span class="wps_title" id="lt_NetParam_value"></span>
			<input type="text" id="txtNetParam" class="textfield" maxlength="3" style="width:60px">
			<span id="lt_NetParam_range"></span>
		</div>
		<div class="wps_group">
			<input type="checkbox" id="NetParamIpv6">
			<span id="lt_NetParam_ipv6"></span>
		</div>
		<div class="wps_group">
			<span class="wps_title" id="lt_NetParam_status"></span>
			<span id="NetParamStatus"><span id="lt_NetParam_on" style="display:none"></span><span id="lt_NetParam_off" style="display:none"></span> <span id="NetParamStatusVal"></span></span>
		</div>
		<div class="buttonRow1">
			<input type="button" id="lt_NetParam_btnRemove" class="btn-apply">
			<input type="button" id="lt_NetParam_btnRestore" class="btn-apply">
			<input type="button" id="lt_btnApply" class="btn-apply">
		</div>
	</body>
</html>
