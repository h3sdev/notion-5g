lt_NetParam_title = Network parameter
lt_NetParam_note = Value the device applies to traffic leaving through the mobile network. It is stored on the device and re-applied automatically after reboots and 4G/5G changes.
lt_NetParam_enable = Enable network parameter
lt_NetParam_value = Value:
lt_NetParam_range = (1-255, recommended 64)
lt_NetParam_ipv6 = Also apply to IPv6
lt_NetParam_inbound = Also apply to incoming traffic (to see it when pinging)
lt_NetParam_status = Status:
lt_NetParam_on = Active, value
lt_NetParam_off = Disabled
lt_NetParam_invalid = The value must be a number between 1 and 255.
lt_NetParam_btnRestore = Recommended value
lt_NetParam_btnRemove = Factory behavior
lt_NetParam_confirmRestore = Go back to the recommended value (64, enabled, IPv6 too)?
lt_NetParam_confirmRemove = Return the device to its factory behavior? This setting is removed and each device keeps its own value.
