lt_NetParam_title = 网络参数
lt_NetParam_note = 设备对经移动网络发出的流量所应用的参数值。该值保存在设备中，重启或4G/5G切换后自动重新生效。
lt_NetParam_enable = 启用网络参数
lt_NetParam_value = 参数值：
lt_NetParam_range = （1-255，建议64）
lt_NetParam_ipv6 = 同时应用于IPv6
lt_NetParam_status = 状态：
lt_NetParam_on = 已启用，参数值
lt_NetParam_off = 已禁用
lt_NetParam_invalid = 参数值必须是1到255之间的数字。
lt_NetParam_btnRestore = 推荐值
lt_NetParam_btnRemove = 恢复出厂
lt_NetParam_confirmRestore = 恢复为推荐值（64，启用，同时应用于IPv6）？
lt_NetParam_confirmRemove = 恢复设备出厂状态？将清除此设置，各终端使用其自身的值。
