mNotionTTL = Outbound TTL
lt_NotionTTL_title = Outbound TTL (mobile network)
lt_NotionTTL_note = Sets the TTL (IPv4) and Hop Limit (IPv6) of packets leaving through the mobile network. The value is stored on the device and re-applied automatically after reboots and 4G/5G changes.
lt_NotionTTL_enable = Set outbound TTL
lt_NotionTTL_value = TTL value:
lt_NotionTTL_range = (1-255, recommended 64)
lt_NotionTTL_ipv6 = Also apply to IPv6 (Hop Limit)
lt_NotionTTL_status = Status:
lt_NotionTTL_on = Active, TTL
lt_NotionTTL_off = Disabled
lt_NotionTTL_invalid = TTL must be a number between 1 and 255.
