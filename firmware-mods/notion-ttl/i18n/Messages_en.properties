lt_NotionTTL_title = Network parameter
lt_NotionTTL_note = Value the device applies to traffic leaving through the mobile network. It is stored on the device and re-applied automatically after reboots and 4G/5G changes.
lt_NotionTTL_enable = Enable network parameter
lt_NotionTTL_value = Value:
lt_NotionTTL_range = (1-255, recommended 64)
lt_NotionTTL_ipv6 = Also apply to IPv6
lt_NotionTTL_status = Status:
lt_NotionTTL_on = Active, value
lt_NotionTTL_off = Disabled
lt_NotionTTL_invalid = The value must be a number between 1 and 255.
lt_NotionTTL_btnRestore = Recommended value
lt_NotionTTL_btnRemove = Factory behavior
lt_NotionTTL_confirmRestore = Go back to the recommended value (64, enabled, IPv6 too)?
lt_NotionTTL_confirmRemove = Return the device to its factory behavior? This setting is removed and each device keeps its own value.
