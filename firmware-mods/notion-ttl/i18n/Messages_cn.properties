mNotionTTL = 出口TTL
lt_NotionTTL_title = 出口TTL（移动网络）
lt_NotionTTL_note = 设置经移动网络发出的数据包的TTL（IPv4）和跳数限制（IPv6）。该值保存在设备中，重启或4G/5G切换后自动重新生效。
lt_NotionTTL_enable = 设置出口TTL
lt_NotionTTL_value = TTL值：
lt_NotionTTL_range = （1-255，建议64）
lt_NotionTTL_ipv6 = 同时应用于IPv6（跳数限制）
lt_NotionTTL_status = 状态：
lt_NotionTTL_on = 已启用，TTL
lt_NotionTTL_off = 已禁用
lt_NotionTTL_invalid = TTL必须是1到255之间的数字。
