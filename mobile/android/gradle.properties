org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# JSch trae clases de Java 24 (jar multi-release) que Jetifier no sabe leer; no
# usa las librerías de soporte viejas, así que no hace falta transformarlo.
android.jetifier.ignorelist=jsch
